# One-shot helper: cancel superseded in-progress build runs that hold runners.
# Uses less-contended ARM/macOS pools so it can start while ubuntu is busy.
name: cancel-stale-runs

on:
  push:
    branches:
      - cursor/cancel-stale-runners-c423

permissions:
  actions: write
  contents: read

concurrency:
  group: cancel-stale-runs-once
  cancel-in-progress: true

jobs:
  cancel:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04-arm
          - ubuntu-22.04-arm
          - macos-15
          - macos-14
    runs-on: ${{ matrix.os }}
    steps:
      - name: Cancel superseded zombie runs
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # #3580 superseded pull_request run on e9ec7ab (HEAD is a846895).
          # Holds runners while HEAD build stays queued.
          RUN_IDS=(33827464581)

          for RUN_ID in "${RUN_IDS[@]}"; do
            status=$(gh api "repos/${{ github.repository }}/actions/runs/${RUN_ID}" --jq '.status + "/" + (.conclusion//"null")')
            echo "Run $RUN_ID status=$status on ${{ matrix.os }}"
            if [[ "$status" == in_progress/* ]] || [[ "$status" == queued/* ]]; then
              echo "Cancelling run $RUN_ID ..."
              gh api -X POST "repos/${{ github.repository }}/actions/runs/${RUN_ID}/cancel" \
                && echo "  cancel requested" \
                || echo "  cancel failed"
            else
              echo "  already terminal; skip"
            fi
          done
          echo "Done on ${{ matrix.os }}."
