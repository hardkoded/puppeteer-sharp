# Disabled after one-shot cancel completed. Keep as no-op so leftover
# matrix jobs from prior pushes cannot re-cancel active CI runs.
name: cancel-stale-runs

on:
  push:
    branches:
      - cursor/cancel-stale-runners-c423
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cancel-stale-runs-once
  cancel-in-progress: true

jobs:
  noop:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: No-op
        run: echo "cancel-stale-runs is disabled; refusing to cancel anything."
