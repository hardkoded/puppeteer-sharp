# One-shot SINGLE-runner: wait for #3572 run idle, then rerun-failed. NO matrix.
name: cancel-stale-runs

on:
  push:
    branches:
      - cursor/cancel-stale-runners-c423

permissions:
  actions: write
  contents: read

concurrency:
  group: cancel-stale-runs-once
  cancel-in-progress: true

jobs:
  wait-and-rerun-3572-failed:
    runs-on: ubuntu-24.04-arm
    # FF suite can take ~80-90m; allow headroom
    timeout-minutes: 150
    steps:
      - name: Wait for #3572 idle then rerun-failed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"
          RUN_ID=33826226644
          echo "Waiting for run $RUN_ID to have 0 in_progress jobs ..."
          for i in $(seq 1 280); do
            ip=$(gh api "repos/$REPO/actions/runs/$RUN_ID/jobs?per_page=100" \
              --jq '[.jobs[]|select(.status=="in_progress")]|length')
            st=$(gh api "repos/$REPO/actions/runs/$RUN_ID" \
              --jq '.status + "/" + (.conclusion//"null") + " attempt=" + (.run_attempt|tostring)')
            echo "$(date -u +%H:%M:%S) [$i] run=$st in_progress=$ip"
            if [[ "$ip" -eq 0 ]]; then
              echo "Run idle — POST rerun-failed-jobs"
              gh api -X POST "repos/$REPO/actions/runs/$RUN_ID/rerun-failed-jobs"
              sleep 8
              gh api "repos/$REPO/actions/runs/$RUN_ID" --jq '{status,conclusion,run_attempt}'
              gh api "repos/$REPO/actions/runs/$RUN_ID/jobs?per_page=100" \
                --jq '.jobs[] | select(.conclusion != "success") | {id,name,status,conclusion}'
              exit 0
            fi
            sleep 20
          done
          echo "Timed out waiting for idle run"
          exit 1
