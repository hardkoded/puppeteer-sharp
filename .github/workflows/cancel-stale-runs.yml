# One-shot SINGLE-runner: unstick #3580 stuck queue, then wait+#3572 rerun-failed. NO matrix.
name: cancel-stale-runs

on:
  push:
    branches:
      - cursor/cancel-stale-runners-c423

permissions:
  actions: write
  contents: read

concurrency:
  group: cancel-stale-runs-once
  cancel-in-progress: true

jobs:
  unstick-3580-then-3572:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 150
    steps:
      - name: Unstick #3580 (4 jobs queued ~6h) then wait+#3572 rerun-failed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"

          echo "=== #3580: cancel stuck build run 33827483215 then rerun-failed ==="
          RUN_3580=33827483215
          st=$(gh api "repos/$REPO/actions/runs/$RUN_3580" --jq '.status + "/" + (.conclusion//"null") + " sha=" + .head_sha')
          echo "Run $RUN_3580 $st"
          ip=$(gh api "repos/$REPO/actions/runs/$RUN_3580/jobs?per_page=100" --jq '[.jobs[]|select(.status=="in_progress")]|length')
          echo "in_progress=$ip"
          if [[ "$ip" -eq 0 ]]; then
            echo "Cancelling to convert stuck queued jobs to cancelled ..."
            gh api -X POST "repos/$REPO/actions/runs/$RUN_3580/cancel" || true
            for i in $(seq 1 36); do
              s=$(gh api "repos/$REPO/actions/runs/$RUN_3580" --jq .status)
              echo "  status=$s ($i)"
              [[ "$s" == "completed" ]] && break
              sleep 5
            done
            echo "POST rerun-failed-jobs for #3580 ..."
            gh api -X POST "repos/$REPO/actions/runs/$RUN_3580/rerun-failed-jobs" || true
            sleep 5
            gh api "repos/$REPO/actions/runs/$RUN_3580/jobs?per_page=100" \
              --jq '.jobs[] | select(.conclusion != "success") | {id,name,status,conclusion}'
          else
            echo "#3580 has in_progress jobs; skip cancel"
          fi

          echo "=== #3572: wait idle then rerun-failed ==="
          RUN_3572=33826226644
          for i in $(seq 1 280); do
            ip=$(gh api "repos/$REPO/actions/runs/$RUN_3572/jobs?per_page=100" \
              --jq '[.jobs[]|select(.status=="in_progress")]|length')
            st=$(gh api "repos/$REPO/actions/runs/$RUN_3572" \
              --jq '.status + "/" + (.conclusion//"null") + " attempt=" + (.run_attempt|tostring)')
            echo "$(date -u +%H:%M:%S) [$i] #3572 run=$st in_progress=$ip"
            if [[ "$ip" -eq 0 ]]; then
              echo "Run idle — POST rerun-failed-jobs"
              gh api -X POST "repos/$REPO/actions/runs/$RUN_3572/rerun-failed-jobs"
              sleep 8
              gh api "repos/$REPO/actions/runs/$RUN_3572/jobs?per_page=100" \
                --jq '.jobs[] | select(.conclusion != "success") | {id,name,status,conclusion}'
              exit 0
            fi
            sleep 20
          done
          echo "Timed out waiting for #3572 idle"
          exit 1
