# One-shot helper: cancel superseded in-progress builds that predate concurrency
# and are holding runners. Safe to delete this branch/workflow afterward.
name: cancel-stale-runs

on:
  push:
    branches:
      - cursor/cancel-stale-runners-c423

permissions:
  actions: write
  contents: read

concurrency:
  group: cancel-stale-runs-once
  cancel-in-progress: false

jobs:
  cancel:
    strategy:
      fail-fast: false
      matrix:
        # Different pools — whichever gets a runner first cancels the stale runs.
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Cancel superseded workflow runs
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          IDS=(
            33816203117
            33816164930
            33772684245
          )
          for id in "${IDS[@]}"; do
            echo "Cancelling run $id from ${{ matrix.os }} ..."
            gh api -X POST "repos/${{ github.repository }}/actions/runs/${id}/cancel" \
              && echo "  cancel requested for $id" \
              || echo "  cancel failed for $id (may already be completed)"
          done
          echo "Done on ${{ matrix.os }}."
