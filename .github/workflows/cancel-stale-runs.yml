# Hang-cancel via RUN cancel (not job cancel) + idle-rerun. macos. NO matrix.
# Bugfix: actions/jobs/{id}/cancel is 404; use actions/runs/{id}/cancel.
name: cancel-stale-runs

on:
  push:
    branches:
      - cursor/cancel-stale-runners-c423

permissions:
  actions: write
  contents: read

concurrency:
  group: cancel-stale-runs-once
  cancel-in-progress: true

jobs:
  hang-and-idle-rerun:
    runs-on: macos-latest
    steps:
      - name: Hang-cancel runs and idle-rerun flakes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"

          test_age_mins() {
            local job_id="$1"
            local age
            age=$(gh api "repos/$REPO/actions/jobs/$job_id" --jq '
              (.steps[]? | select(.name|startswith("Test")) | select(.status=="in_progress") | .started_at) // empty')
            if [[ -z "$age" ]]; then echo -1; return; fi
            python3 -c "import datetime; s=datetime.datetime.fromisoformat('${age}'.replace('Z','+00:00')); print(int((datetime.datetime.now(datetime.timezone.utc)-s).total_seconds()//60))"
          }

          cancel_and_rerun() {
            local label="$1" RUN_ID="$2" JOB_ID="$3"
            echo "==== CANCEL $label run=$RUN_ID job=$JOB_ID ===="
            gh api -X POST "repos/$REPO/actions/runs/$RUN_ID/cancel" || true
            for i in $(seq 1 60); do
              s=$(gh api "repos/$REPO/actions/jobs/$JOB_ID" --jq .status)
              echo "  status=$s ($i)"
              [[ "$s" != "in_progress" && "$s" != "queued" ]] && break
              sleep 5
            done
            for i in $(seq 1 36); do
              ip=$(gh api "repos/$REPO/actions/runs/$RUN_ID/jobs?per_page=100" \
                --jq '[.jobs[]|select(.status=="in_progress")]|length')
              echo "  in_progress=$ip ($i)"
              [[ "$ip" -eq 0 ]] && break
              sleep 5
            done
            echo "POST rerun-failed-jobs for $label"
            gh api -X POST "repos/$REPO/actions/runs/$RUN_ID/rerun-failed-jobs" || true
            sleep 4
            gh api "repos/$REPO/actions/runs/$RUN_ID/jobs?per_page=100" \
              --jq '.jobs[]|select(.conclusion!="success")|{id,name,status,conclusion}'
          }

          try_idle_rerun() {
            local label="$1" RUN_ID="$2"
            local ip fail canc
            ip=$(gh api "repos/$REPO/actions/runs/$RUN_ID/jobs?per_page=100" \
              --jq '[.jobs[]|select(.status=="in_progress" or .status=="queued")]|length')
            fail=$(gh api "repos/$REPO/actions/runs/$RUN_ID/jobs?per_page=100" \
              --jq '[.jobs[]|select(.conclusion=="failure")]|length')
            canc=$(gh api "repos/$REPO/actions/runs/$RUN_ID/jobs?per_page=100" \
              --jq '[.jobs[]|select(.conclusion=="cancelled")]|length')
            echo "$label idle-check ip=$ip fail=$fail canc=$canc"
            if [[ "$ip" -eq 0 && ( "$fail" -gt 0 || "$canc" -gt 0 ) ]]; then
              echo "POST rerun-failed-jobs for $label"
              gh api -X POST "repos/$REPO/actions/runs/$RUN_ID/rerun-failed-jobs" || true
              sleep 4
              return 0
            fi
            if [[ "$ip" -eq 0 && "$fail" -eq 0 && "$canc" -eq 0 ]]; then
              echo "$label idle all success"
              return 0
            fi
            return 1
          }

          # Known hung / near-hung job IDs at push time
          # 3576 FF-headless 100941955060 (>=120m) — cancel whole run then rerun-failed
          # 3576 FF-headful  100941955236 (~116m)
          # 3580 FF-headful  100956517230 (~102m)
          # 3571 FF-headful  100979567393 (~73m)
          # 3575 FF-headless 100980129425 (~72m)

          done3571=0
          done3575=0
          done3576=0
          done3580=0

          # Immediate: cancel hung 3576 if still IP
          j3576=$(gh api "repos/$REPO/actions/jobs/100941955060" --jq .status)
          echo "3576 headless status=$j3576 age=$(test_age_mins 100941955060)m"
          if [[ "$j3576" == "in_progress" ]]; then
            m=$(test_age_mins 100941955060)
            if [[ "$m" -ge 120 ]]; then
              cancel_and_rerun "3576" 33847311896 100941955060
              done3576=1
            fi
          fi

          # Poll ~90 minutes for remaining
          for i in $(seq 1 180); do
            echo "---- poll $i $(date -u +%H:%M:%S) ----"

            if [[ "$done3576" -eq 0 ]]; then
              s=$(gh api "repos/$REPO/actions/jobs/100941955060" --jq '.status + "/" + (.conclusion//"-")')
              echo "3576=$s"
              if [[ "$s" == in_progress/* ]]; then
                m=$(test_age_mins 100941955060)
                echo "3576 Test age=${m}m"
                if [[ "$m" -ge 120 ]]; then
                  cancel_and_rerun "3576" 33847311896 100941955060
                  done3576=1
                fi
              else
                if try_idle_rerun "3576" 33847311896; then done3576=1; fi
              fi
            else
              echo "3576 already handled"
            fi

            if [[ "$done3580" -eq 0 ]]; then
              s=$(gh api "repos/$REPO/actions/jobs/100956517230" --jq '.status + "/" + (.conclusion//"-")')
              echo "3580=$s"
              if [[ "$s" == in_progress/* ]]; then
                m=$(test_age_mins 100956517230)
                echo "3580 Test age=${m}m"
                if [[ "$m" -ge 120 ]]; then
                  cancel_and_rerun "3580" 33851930748 100956517230
                  done3580=1
                fi
              else
                if try_idle_rerun "3580" 33851930748; then done3580=1; fi
              fi
            else
              echo "3580 already handled"
            fi

            if [[ "$done3571" -eq 0 ]]; then
              s=$(gh api "repos/$REPO/actions/jobs/100979567393" --jq '.status + "/" + (.conclusion//"-")')
              echo "3571=$s"
              if [[ "$s" == in_progress/* ]]; then
                m=$(test_age_mins 100979567393)
                echo "3571 Test age=${m}m"
                if [[ "$m" -ge 120 ]]; then
                  cancel_and_rerun "3571" 33833625960 100979567393
                  done3571=1
                fi
              else
                if try_idle_rerun "3571" 33833625960; then done3571=1; fi
              fi
            else
              echo "3571 already handled"
            fi

            if [[ "$done3575" -eq 0 ]]; then
              s=$(gh api "repos/$REPO/actions/jobs/100980129425" --jq '.status + "/" + (.conclusion//"-")')
              echo "3575=$s"
              if [[ "$s" == in_progress/* ]]; then
                m=$(test_age_mins 100980129425)
                echo "3575 Test age=${m}m"
                if [[ "$m" -ge 120 ]]; then
                  cancel_and_rerun "3575" 33819078284 100980129425
                  done3575=1
                fi
              else
                if try_idle_rerun "3575" 33819078284; then done3575=1; fi
              fi
            else
              echo "3575 already handled"
            fi

            if [[ "$done3571" -eq 1 && "$done3575" -eq 1 && "$done3576" -eq 1 && "$done3580" -eq 1 ]]; then
              echo "All handled; done"
              exit 0
            fi
            sleep 30
          done
          echo "timed out; 3571=$done3571 3575=$done3575 3576=$done3576 3580=$done3580" >&2
          exit 1
