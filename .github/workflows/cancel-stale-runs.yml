# One-shot SINGLE-runner: rerun cancelled/failed jobs on #3572 after hang cancel. NO matrix.
name: cancel-stale-runs

on:
  push:
    branches:
      - cursor/cancel-stale-runners-c423

permissions:
  actions: write
  contents: read

concurrency:
  group: cancel-stale-runs-once
  cancel-in-progress: true

jobs:
  rerun-3572-failed:
    # ubuntu-latest: ARM helper sat queued >10m; use larger pool for this one-shot.
    runs-on: ubuntu-latest
    steps:
      - name: Rerun failed/cancelled jobs on #3572 run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"
          RUN_ID=33826226644
          st=$(gh api "repos/$REPO/actions/runs/$RUN_ID" --jq '.status + "/" + (.conclusion//"null") + " attempt=" + (.run_attempt|tostring)')
          echo "Run $RUN_ID $st"
          # List non-success jobs
          gh api "repos/$REPO/actions/runs/$RUN_ID/jobs?per_page=100" \
            --jq '.jobs[] | select(.conclusion != "success") | {id,name,status,conclusion}'
          echo "gh run rerun --failed ..."
          gh run rerun "$RUN_ID" --failed --repo "$REPO" || \
            gh api -X POST "repos/$REPO/actions/runs/$RUN_ID/rerun-failed-jobs" || true
