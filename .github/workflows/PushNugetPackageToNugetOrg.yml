name: PushToNugetOrg

on:
  workflow_dispatch:
  push:
    tags:
        - v*

env:
  DOTNET_VERSION: '10.0.x' # The .NET SDK version to use

jobs:
   PushToNugetOrg:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Required for NuGet Trusted Publishing (OIDC)
      contents: read
    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 0
    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: 10.0.x
    - name: Install dependencies
      run: |
        dotnet restore lib/PuppeteerSharp.sln
        dotnet dev-certs https -ep lib/PuppeteerSharp.TestServer/testCert.cer
    - name: Build
      env:
        SixLaborsLicenseKey: ${{ secrets.IMAGE_SHARP_LICENSE }}
      run: |
        dotnet build lib/PuppeteerSharp.sln --configuration Release --no-restore
        ls ./lib/PuppeteerSharp/bin/Release
    - name: NuGet login (OIDC trusted publishing)
      uses: NuGet/login@v1
      id: login
      with:
        user: kblok # nuget.org profile name (not email) that owns the packages
    - name: NugetPush to nuget.org
      run: |
        dotnet nuget push ./lib/PuppeteerSharp/bin/Release/*.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json
    - name: Restore (CDP only)
      run: |
        dotnet restore lib/PuppeteerSharp/PuppeteerSharp.csproj /p:DefineConstants=CDP_ONLY
    - name: Build (CDP only)
      run: |
        dotnet build lib/PuppeteerSharp/PuppeteerSharp.csproj /p:DefineConstants=CDP_ONLY --configuration Release --no-restore --no-incremental
    - name: Pack (CDP only)
      run: |
        dotnet pack lib/PuppeteerSharp/PuppeteerSharp.csproj /p:DefineConstants=CDP_ONLY /p:Title=PuppeteerSharp.Cdp /p:PackageId=PuppeteerSharp.Cdp /p:Description="Headless Browser .NET API with CDP support only (no WebDriverBiDi)" --configuration Release --no-restore --no-build
        ls ./lib/PuppeteerSharp/bin/Release
    - name: NugetPush to nuget.org (CDP only)
      run: |
        dotnet nuget push ./lib/PuppeteerSharp/bin/Release/PuppeteerSharp.Cdp*.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json
