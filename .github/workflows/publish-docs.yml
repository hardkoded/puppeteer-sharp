# Retired. DocFX is no longer published from this workflow.
# Starlight docs are built and deployed by docs.yml on pushes to master
# (GitHub Actions → Pages). This file stays so a tag push does not deploy
# the old DocFX output and fight that deployment.
#
# Repository settings: Pages → Source must be "GitHub Actions", not the
# gh-pages branch. The custom domain stays www.puppeteersharp.com
# (docs-site/public/CNAME).
name: Publish docs (retired)

on:
  workflow_dispatch:

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: Docs moved to docs.yml
        run: echo "DocFX tag publishing was retired. .github/workflows/docs.yml publishes the Starlight site from master."
